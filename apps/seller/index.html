<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="THANGPC seller workspace for products, orders, inventory, and fulfillment." />
    <title>THANGPC Seller Workspace</title>
  </head>
  <body>
    <div id="root"></div><script>
  (() => {
    try {
      const theme = localStorage.getItem('kipi.seller.theme')
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.sellerTheme = theme
    } catch (_) {}
  })()
</script><script type="module" src="/src/main.tsx"></script>
  </body>
</html>
