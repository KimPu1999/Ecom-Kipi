name: kipi-production

services:
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/backend.production.Dockerfile
    env_file: ../../backend/laravel-api/.env.production
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - laravel_storage:/var/www/backend/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["${API_PORT:-8080}:8080"]
    volumes:
      - ../../backend/laravel-api:/var/www/backend:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/backend.production.Dockerfile
    env_file: ../../backend/laravel-api/.env.production
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--timeout=120", "--max-time=3600"]
    restart: unless-stopped
    volumes: ["laravel_storage:/var/www/backend/storage"]
    depends_on: [api]

  scheduler:
    build:
      context: ../..
      dockerfile: infrastructure/docker/backend.production.Dockerfile
    env_file: ../../backend/laravel-api/.env.production
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    volumes: ["laravel_storage:/var/www/backend/storage"]
    depends_on: [api]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?set DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME:?set DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
    volumes: ["mysql_data:/var/lib/mysql"]
    expose: ["3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    expose: ["6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mysql_data:
  redis_data:
  laravel_storage:
